<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profilo utente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap">
<style>
  :root {
    --bg: #232f3e;
    --card: #2d3a4b;
    --border: #4a5666;
    --text: #ffffff;
    --text-muted: #dcdee0;
    --accent: #39d353;
    --ink: #000000;
    --locked: #8a8f96;
    --radius-card: 18px;
    --radius-badge: 30%;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Montserrat, Arial, Helvetica, sans-serif;
  }
  .profile {
    max-width: 430px;
    margin: 0 auto;
    padding: 28px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* Header */
  .profile__header { display: flex; justify-content: space-between; align-items: center; }
  .profile__title { margin: 0; font-size: 22px; font-weight: 800; }
  .btn-outline {
    height: 44px; padding: 0 18px;
    border-radius: 22px; border: 1px solid var(--border);
    background: transparent; color: var(--text);
    font: 600 14px Montserrat, Arial, sans-serif; cursor: pointer;
  }
  .btn-outline:hover { border-color: var(--accent); }

  /* Badge (icona su fondo verde) */
  .badge {
    display: grid; place-items: center; flex-shrink: 0;
    border-radius: var(--radius-badge);
    background: var(--accent);
  }
  .badge svg {
    fill: none; stroke: var(--ink);
    stroke-linecap: round; stroke-linejoin: round;
  }
  .badge--locked { background: transparent; box-shadow: inset 0 0 0 2px var(--border); }
  .badge--locked svg { stroke: var(--locked); }

  /* Identità */
  .identity { display: flex; align-items: center; gap: 18px; }
  .identity .badge { width: 104px; height: 104px; }
  .identity .badge svg { width: 70px; height: 70px; stroke-width: 5; }
  .identity__info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .identity__name { font-size: 24px; font-weight: 800; line-height: 1.15; }
  .identity__handle { font-size: 15px; color: var(--text-muted); }
  .level-pill {
    align-self: flex-start; margin-top: 4px; padding: 6px 12px;
    border-radius: 999px; background: var(--accent); color: var(--ink);
    font-size: 13px; font-weight: 700;
  }

  /* Statistiche */
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .stat {
    background: var(--card); border-radius: var(--radius-card);
    padding: 14px 12px; display: flex; flex-direction: column; gap: 6px;
  }
  .stat svg {
    width: 26px; height: 26px; fill: none; stroke: var(--accent);
    stroke-width: 6; stroke-linecap: round; stroke-linejoin: round;
  }
  .stat__value { font-size: 22px; font-weight: 800; }
  .stat__label { font-size: 13px; color: var(--text-muted); }

  /* Sezioni */
  .section { display: flex; flex-direction: column; gap: 14px; }
  .section__head { display: flex; justify-content: space-between; align-items: baseline; }
  .section__title { margin: 0; font-size: 17px; font-weight: 800; }
  .section__link { font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none; }
  .section__link:hover { color: var(--text); }

  /* Griglia badge */
  .badges {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px; justify-items: center;
  }
  .badges .badge { width: 72px; height: 72px; }
  .badges .badge svg { width: 48px; height: 48px; stroke-width: 5.2; }

  /* Ultimi allenamenti */
  .workouts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .workout {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border-radius: var(--radius-card); padding: 12px;
  }
  .workout .badge { width: 48px; height: 48px; }
  .workout .badge svg { width: 32px; height: 32px; stroke-width: 5.5; }
  .workout__info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .workout__title { font-size: 15px; font-weight: 700; }
  .workout__meta { font-size: 13px; color: var(--text-muted); }

  @media (max-width: 360px) {
    .badges .badge { width: 60px; height: 60px; }
    .badges .badge svg { width: 40px; height: 40px; stroke-width: 5.6; }
  }
</style>
</head>
<body>

</svg>

<main class="profile">
  <header class="profile__header">
    <h1 class="profile__title">Profilo</h1>
    <button type="button" class="btn-outline">Modifica</button>
  </header>

  <section class="identity" aria-label="Utente">
    <div class="badge">
      <svg role="img" aria-label="Avatar Muscolo"><use href="#i-muscle"/></svg>
    </div>
    <div class="identity__info">
      <span class="identity__name">[Nome Utente]</span>
      <span class="identity__handle">@[username]</span>
      <span class="level-pill">Livello [N]</span>
    </div>
  </section>

  <section class="stats" aria-label="Statistiche">
    <div class="stat">
      <svg aria-hidden="true"><use href="#i-dumbbell"/></svg>
      <span class="stat__value">[N]</span>
      <span class="stat__label">Workout</span>
    </div>
    <div class="stat">
      <svg aria-hidden="true"><use href="#i-flame"/></svg>
      <span class="stat__value">[N]</span>
      <span class="stat__label">Giorni streak</span>
    </div>
    <div class="stat">
      <svg aria-hidden="true"><use href="#i-trophy"/></svg>
      <span class="stat__value">[N]</span>
      <span class="stat__label">Record</span>
    </div>
  </section>

  <section class="section">
    <div class="section__head">
      <h2 class="section__title">Badge sbloccati</h2>
      <a class="section__link" href="#">Vedi tutti</a>
    </div>
    <ul class="badges">
      <li class="badge"><svg role="img" aria-label="Muscolo"><use href="#i-muscle"/></svg></li>
      <li class="badge"><svg role="img" aria-label="Bilanciere"><use href="#i-barbell"/></svg></li>
      <li class="badge"><svg role="img" aria-label="Kettlebell"><use href="#i-kettlebell"/></svg></li>
      <li class="badge"><svg role="img" aria-label="Medaglia"><use href="#i-medal"/></svg></li>
      <li class="badge"><svg role="img" aria-label="Corona"><use href="#i-crown"/></svg></li>
      <li class="badge"><svg role="img" aria-label="Fulmine"><use href="#i-bolt"/></svg></li>
      <li class="badge badge--locked"><svg role="img" aria-label="Stella, bloccato"><use href="#i-star"/></svg></li>
      <li class="badge badge--locked"><svg role="img" aria-label="Obiettivo, bloccato"><use href="#i-target"/></svg></li>
    </ul>
  </section>

  <section class="section">
    <h2 class="section__title">Ultimi allenamenti</h2>
    <ul class="workouts">
      <li class="workout">
        <div class="badge"><svg aria-hidden="true"><use href="#i-dumbbell"/></svg></div>
        <div class="workout__info">
          <span class="workout__title">[Scheda forza]</span>
          <span class="workout__meta">[data] · [durata]</span>
        </div>
      </li>
      <li class="workout">
        <div class="badge"><svg aria-hidden="true"><use href="#i-sneaker"/></svg></div>
        <div class="workout__info">
          <span class="workout__title">[Sessione cardio]</span>
          <span class="workout__meta">[data] · [durata]</span>
        </div>
      </li>
    </ul>
  </section>
</main>

</body>
</html>
